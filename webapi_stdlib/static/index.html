<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame2d 互動編輯器</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; margin: 0; }
  #left { padding: 0 0.8rem 0.8rem; max-width: 900px; margin: 0 auto; }

  /* ---- 屬性面板改成彈出式(bottom sheet), 不用往下滑找 ---- */
  #propModalBackdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; }
  #propModalBackdrop.open { display: block; }
  #propModal { display: none; position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
               width: min(440px, 94vw); max-height: 82vh; overflow-y: auto; background: #fff;
               border-radius: 14px 14px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,0.25); z-index: 101; padding: 0.9rem; }
  #propModal.open { display: block; }
  #propModal button, #propModal input, #propModal select { }
  h1 { font-size: 1.05rem; margin: 0; padding: 0.6rem 0 0.3rem; }
  .hint { font-size: 0.78rem; color: #666; margin-bottom: 0.6rem; }

  /* ---- 固定工具列: 選單列 + 展開面板 + 常駐快捷列, 用 sticky 讓它捲動時不消失 ---- */
  #topbar { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #ddd; margin: 0 -0.8rem; padding: 0 0.8rem; }
  #menubar { display: flex; gap: 0.3rem; align-items: center; padding: 0.4rem 0; flex-wrap: wrap; }
  #menubar .menuBtn { padding: 0.4rem 0.8rem; font-size: 0.85rem; cursor: pointer; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; }
  #menubar .menuBtn.open { background: #2563eb; color: white; border-color: #2563eb; }
  #menubar .sep-v { width: 1px; align-self: stretch; background: #ddd; margin: 0 0.2rem; }
  /* 選單面板改成絕對定位的下拉浮層, 蓋在畫布上面, 不會把下面內容擠開 */
  #menuPanel { display: none; position: absolute; top: 100%; left: 0.8rem; right: 0.8rem;
               background: #fff; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px;
               box-shadow: 0 8px 20px rgba(0,0,0,0.15); padding: 0.6rem; gap: 0.3rem; flex-wrap: wrap;
               align-items: center; max-height: 70vh; overflow-y: auto; z-index: 55; }
  #menuPanel.open { display: flex; }
  #menuPanel > .menuGroup { display: none; gap: 0.3rem; flex-wrap: wrap; align-items: center; width: 100%; }
  #menuPanel > .menuGroup.active { display: flex; }
  #topbar button { padding: 0.4rem 0.7rem; font-size: 0.85rem; cursor: pointer; }
  #topbar button.active { background: #2563eb; color: white; border-color: #2563eb; }
  #topbar .sep { flex-basis: 100%; height: 0; }
  #topbar label.snapLabel { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.8rem; margin: 0; width: auto; white-space: nowrap; }
  #topbar label.snapLabel input { width: auto; }

  #canvasWrap { border: 1px solid #ccc; background: #fdfdfd; overflow: hidden; touch-action: none; margin-top: 0.5rem; }
  svg { width: 100%; height: auto; display: block; touch-action: none; }
  .node-circle { fill: #1f2937; stroke: #1f2937; stroke-width: 2; cursor: grab; }
  .node-circle.selected { fill: #2563eb; stroke: #2563eb; }
  .pin-marker { fill: #fff; stroke: #1f2937; stroke-width: 1.5; }
  .node-label { font-size: 11px; fill: #1f2937; pointer-events: none; }
  .member-line { stroke: #1f2937; stroke-width: 3; cursor: pointer; }
  .member-line.selected { stroke: #2563eb; }
  .member-line.faint { stroke: #cbd5e1; stroke-width: 1.5; }
  .member-label { font-size: 10px; fill: #6b7280; pointer-events: none; }
  .deformed-line { stroke: #ea580c; stroke-width: 2; fill: none; }
  .diagram-fill { fill: rgba(37, 99, 235, 0.22); stroke: #2563eb; stroke-width: 1; }
  .diagram-fill.M { fill: rgba(220, 38, 38, 0.20); stroke: #dc2626; }
  .load-arrow { stroke: #dc2626; stroke-width: 2; }
  .support-symbol { fill: #374151; stroke: #374151; }
  .support-hatch { stroke: #374151; stroke-width: 1.2; }
  .value-label { font-size: 9px; }
  .grid-line { stroke: #cbd5e1; stroke-width: 1; }
  #status { font-size: 0.8rem; margin: 0.25rem 0 0; min-height: 1.1em; color: #0891b2; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 0.8rem; padding: 0.6rem; }
  legend { font-size: 0.85rem; font-weight: bold; padding: 0 0.3rem; }
  label { display: block; font-size: 0.8rem; margin: 0.3rem 0 0.1rem; }
  input, select { width: 100%; padding: 0.3rem; font-size: 0.85rem; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.3rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; margin-top: 0.5rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.4rem; font-size: 0.78rem; }
  th, td { border: 1px solid #ddd; padding: 3px 5px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  details summary { cursor: pointer; font-size: 0.85rem; margin: 0.6rem 0 0.2rem; }
</style>
</head>
<body>

<div id="left">
  <h1>frame2d 互動編輯器</h1>

  <div id="topbar">
    <div id="menubar">
      <button class="menuBtn" data-menu="file">📁 檔案</button>
      <button class="menuBtn" data-menu="model">✏️ 建模</button>
      <button class="menuBtn" data-menu="query">🔎 查詢</button>
      <button class="menuBtn" data-menu="view">👁 檢視</button>
      <span class="sep-v"></span>
      <button id="btnSolve" style="background:#16a34a;color:white;">▶ Solve</button>
    </div>

    <div id="menuPanel">
      <div class="menuGroup" data-group="file">
        <input id="modelName" type="text" placeholder="專案名稱" style="width:9rem;padding:0.35rem;">
        <button id="btnNew">🆕 新建</button>
        <button id="btnSave">💾 儲存</button>
        <button id="btnSaveAs">💾 另存新檔</button>
        <select id="modelSelect" style="width:9rem;"></select>
        <button id="btnLoad">📂 載入</button>
        <button id="btnDeleteModel" style="color:#dc2626;">🗑 刪除</button>
        <span class="sep"></span>
        <button id="btnExportJson">⬇ 匯出JSON</button>
        <label style="display:inline-block;padding:0.4rem 0.7rem;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:0.85rem;width:auto;margin:0;">
          ⬆ 匯入JSON<input id="importJsonFile" type="file" accept="application/json" style="display:none;">
        </label>
        <button id="btnExportMd">⬇ 匯出Markdown</button>
        <button id="btnExportPdf">⬇ 匯出PDF</button>
      </div>

      <div class="menuGroup" data-group="model">
        <button id="btnAddNode">➕ 節點</button>
        <button id="btnAddMember">➕ 桿件</button>
        <span class="sep"></span>
        <label class="snapLabel"><input type="checkbox" id="snapGrid" checked>格線鎖定</label>
        <label class="snapLabel"><input type="checkbox" id="snapNode" checked>節點鎖定</label>
        <label class="snapLabel"><input type="checkbox" id="snapOrtho">正交鎖定(0°/45°/90°)</label>
      </div>

      <div class="menuGroup" data-group="query">
        <select id="queryMember" style="width:8rem;"></select>
        <select id="queryMode" style="width:8rem;">
          <option value="relative">相對位置 0~1</option>
          <option value="absolute">絕對距離(m)</option>
        </select>
        <input id="queryValue" type="number" step="any" value="0.5" style="width:6rem;">
        <button id="btnQueryPoint" style="background:#0891b2;color:white;">🔎 查詢該點</button>
        <button id="btnClearQuery" style="width:auto;">✕ 清除標記</button>
        <span id="queryResult" style="font-size:0.85rem;width:auto;"></span>
      </div>

      <div class="menuGroup" data-group="view">
        <button data-view="structure" class="viewBtn active">結構/荷載</button>
        <button data-view="deformed" class="viewBtn">變形</button>
        <button data-view="N" class="viewBtn">N 圖(軸力)</button>
        <button data-view="V" class="viewBtn">V 圖(剪力)</button>
        <button data-view="M" class="viewBtn">M 圖(彎矩)</button>
        <span class="sep"></span>
        <button id="btnZoomIn">🔍+</button>
        <button id="btnZoomOut">🔍-</button>
        <button id="btnZoomReset">⟲ 原大小</button>
        <span class="sep"></span>
        <label class="snapLabel"><input type="checkbox" id="showGridToggle" checked>顯示格線</label>
        <label class="snapLabel">刻度字體<input type="number" id="gridLabelSizeInput" value="14" min="8" max="28" style="width:3.6rem;"></label>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <div id="canvasWrap">
    <svg id="svg" viewBox="0 0 800 1100">
      <g id="camera"><g id="content"></g></g>
      <g id="overlay"></g>
    </svg>
  </div>

  <details>
    <summary>詳細數值(節點反力/位移、桿件端內力)</summary>
    <h3 style="font-size:0.9rem;">節點結果</h3>
    <table id="nodeTable"><thead>
      <tr><th>node</th><th>ux</th><th>uy</th><th>rot</th><th>Rx(kN)</th><th>Ry(kN)</th><th>M(kN·m)</th></tr>
    </thead><tbody></tbody></table>
    <h3 style="font-size:0.9rem;">桿件端內力</h3>
    <table id="memberTable"><thead>
      <tr><th>member</th><th>L</th><th>角度</th><th>N1</th><th>V1</th><th>M1</th><th>N2</th><th>V2</th><th>M2</th></tr>
    </thead><tbody></tbody></table>
  </details>
</div>

<div id="propModalBackdrop"></div>
<div id="propModal">
  <div id="propPanel"><p class="hint">點節點或桿件看屬性。</p></div>
</div>

<script>
// ---------- 選單列展開/收合 ----------
document.querySelectorAll('.menuBtn').forEach(btn => {
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const name = btn.dataset.menu;
    const panel = document.getElementById('menuPanel');
    const alreadyOpen = btn.classList.contains('open');
    document.querySelectorAll('.menuBtn').forEach(b => b.classList.remove('open'));
    document.querySelectorAll('.menuGroup').forEach(g => g.classList.remove('active'));
    if (alreadyOpen) {
      panel.classList.remove('open');
    } else {
      btn.classList.add('open');
      document.querySelector(`.menuGroup[data-group="${name}"]`).classList.add('active');
      panel.classList.add('open');
    }
  });
});
// 點選單面板以外的地方自動收合(選單本身內部點擊不會冒泡到這裡)
document.getElementById('menuPanel').addEventListener('click', (ev) => ev.stopPropagation());
document.addEventListener('click', () => {
  document.querySelectorAll('.menuBtn').forEach(b => b.classList.remove('open'));
  document.getElementById('menuPanel').classList.remove('open');
});

// ---------- 初始模型: Case-08 純點載重版本 ----------
let model = {
  nodes: [
    {id:0,x:0,y:0}, {id:1,x:5,y:0}, {id:2,x:12,y:0},
    {id:3,x:0,y:4}, {id:4,x:5,y:4}, {id:5,x:12,y:4},
    {id:6,x:0,y:7.5}, {id:7,x:5,y:7.5}, {id:8,x:12,y:7.5}
  ],
  sections: [{name:"sec", E:150e9, I:1e-6, A:0.05}],
  members: [
    {id:0,node_i:0,node_j:3,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:1,node_i:1,node_j:4,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:2,node_i:5,node_j:2,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:3,node_i:3,node_j:4,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:4,node_i:4,node_j:5,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:5,node_i:6,node_j:3,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:6,node_i:7,node_j:4,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:7,node_i:8,node_j:5,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:8,node_i:6,node_j:7,section:"sec",member_type:"frame",release_i:false,release_j:false},
    {id:9,node_i:7,node_j:8,section:"sec",member_type:"frame",release_i:false,release_j:false}
  ],
  supports: [
    {node:0, ux:0.0, uy:0.0, rot:0.0},
    {node:1, ux:0.0, uy:0.0, rot:0.0},
    {node:2, ux:0.0, uy:0.0, rot:0.0}
  ],
  point_loads: [ {node:6, fx:10000, fy:0, m:0}, {node:3, fx:15000, fy:0, m:0} ],
  distributed_loads: [],
  member_point_loads: []
};

let lastResult = null;
let selected = null;        // {type:'node'|'member', id}
let queryMarker = null;     // 桿件內部任意位置查詢的結果(供畫面上標記)
let viewMode = 'structure';
let addMode = null;         // null | 'node' | 'member'
let memberFirstNode = null;
let dragNodeId = null;
let dragMoved = false;

const svg = document.getElementById('svg');
const cameraG = document.getElementById('camera');
let contentG = document.getElementById('content');
const overlayG = document.getElementById('overlay');
const VB_W = 800, VB_H = 1100;
let camera = {x: 0, y: 0, k: 1};

// ---------- 世界座標 <-> 畫布座標(computeTransform) ----------
function computeTransform(pad) {
  if (pad === undefined) pad = 0.16;
  if (model.nodes.length === 0) {
    return { scale: 40, cx: 0, cy: 0, sx: VB_W / 2, sy: VB_H / 2 };
  }
  const xs = model.nodes.map(n => n.x), ys = model.nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX - minX) || 1, h = (maxY - minY) || 1;
  const availW = VB_W * (1 - 2 * pad), availH = VB_H * (1 - 2 * pad);
  const scale = Math.min(availW / w, availH / h);
  return { scale, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, sx: VB_W / 2, sy: VB_H / 2 };
}
// 不同視圖需要的留白不一樣: 結構圖貼緊邊框比較好看; 內力圖/變形圖
// 的圖形會往垂直於桿件的方向鼓出去(最多到對角線15%)還要留數值標籤
// 的空間, 貼太緊字會被切掉。
const PAD_BY_VIEW = {structure: 0.14, deformed: 0.20, N: 0.14, V: 0.14, M: 0.14};
function toScreen(x, y, t) {
  return [t.sx + (x - t.cx) * t.scale, t.sy - (y - t.cy) * t.scale];
}
// client(像素) -> world: 透過 content 群組的 CTM 一次還原「viewBox縮放 + camera平移縮放」
function clientToWorld(evt, t) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(contentG.getScreenCTM().inverse());
  return [(p.x - t.sx) / t.scale + t.cx, -(p.y - t.sy) / t.scale + t.cy];
}
// client(像素) -> camera-space(svg viewBox座標系, camera變換操作的空間)
function clientToCameraSpace(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function nodeById(id) { return model.nodes.find(n => n.id === id); }
function el(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function put(e) { contentG.appendChild(e); return e; }
// 疊加圖層: 位置會跟著世界座標移動, 但完全不受 camera 縮放影響,
// 字體大小永遠固定 —— 專門給刻度數字/文字用, 格線本身(線段)還是
// 放在 contentG 裡跟著結構一起縮放才對(那才是「格線」該有的行為,
// 只有文字不該被放大縮小到看不清楚或蓋滿畫面)。
function toOverlayScreen(x, y, t) {
  const [cx, cy] = toScreen(x, y, t);
  return [camera.x + camera.k * cx, camera.y + camera.k * cy];
}
function putOverlay(e) { overlayG.appendChild(e); return e; }

// ---------- 縮放/平移 ----------
function clampK(k) { return Math.min(15, Math.max(0.3, k)); }
function applyCameraTransform() {
  cameraG.setAttribute('transform', `translate(${camera.x},${camera.y}) scale(${camera.k})`);
}
// 縮放/平移時格線要跟著重算(drawGrid現在是按「目前看得到的範圍」畫的),
// 但這件事不用每個pointermove都做, 用 requestAnimationFrame 節流,
// 手感還是即時(camera transform本身沒有節流), 只有格線重畫節流。
let renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => { renderScheduled = false; render(); });
}
function zoomAt(p, factor) {
  const newK = clampK(camera.k * factor);
  const canonicalAtP = { x: (p.x - camera.x) / camera.k, y: (p.y - camera.y) / camera.k };
  camera.k = newK;
  camera.x = p.x - canonicalAtP.x * newK;
  camera.y = p.y - canonicalAtP.y * newK;
  applyCameraTransform();
  scheduleRender();
}
document.getElementById('btnZoomIn').addEventListener('click', () => zoomAt({x: VB_W/2, y: VB_H/2}, 1.3));
document.getElementById('btnZoomOut').addEventListener('click', () => zoomAt({x: VB_W/2, y: VB_H/2}, 1/1.3));
document.getElementById('btnZoomReset').addEventListener('click', () => { camera = {x:0,y:0,k:1}; applyCameraTransform(); scheduleRender(); });
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAt(clientToCameraSpace(e), e.deltaY < 0 ? 1.15 : 1/1.15);
}, {passive: false});

// 雙指縮放/平移(capture phase,不受節點 stopPropagation 影響)
const activePointers = new Map();
let pinchState = null;
svg.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, clientToCameraSpace(e));
  if (activePointers.size === 2) {
    dragNodeId = null; panState = null;
    const pts = [...activePointers.values()];
    pinchState = {
      startDist: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1,
      startCam: {...camera},
      startMid: {x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2},
    };
  }
}, {capture: true});
svg.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, clientToCameraSpace(e));
  if (activePointers.size === 2 && pinchState) {
    const pts = [...activePointers.values()];
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
    const mid = {x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2};
    const newK = clampK(pinchState.startCam.k * (dist / pinchState.startDist));
    const canonicalAtStart = {
      x: (pinchState.startMid.x - pinchState.startCam.x) / pinchState.startCam.k,
      y: (pinchState.startMid.y - pinchState.startCam.y) / pinchState.startCam.k,
    };
    camera.k = newK;
    camera.x = mid.x - canonicalAtStart.x * newK;
    camera.y = mid.y - canonicalAtStart.y * newK;
    applyCameraTransform();
    scheduleRender();
  }
}, {capture: true});
function releasePointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchState = null;
}
svg.addEventListener('pointerup', releasePointer, {capture: true});
svg.addEventListener('pointercancel', releasePointer, {capture: true});

// 單指拖曳空白處 = 平移
let panState = null;

// ---------- 畫圖 ----------
function render() {
  contentG.innerHTML = '';
  overlayG.innerHTML = '';
  const t = computeTransform(PAD_BY_VIEW[viewMode]);
  if (document.getElementById('showGridToggle').checked) drawGrid(t);

  if (viewMode === 'structure') {
    drawMembers(t, false);
    drawPinMarkers(t);
    drawSupports(t);
    drawLoads(t);
    drawNodes(t);
  } else if (viewMode === 'deformed') {
    drawMembers(t, true);
    if (lastResult) drawDeformed(t); else drawNeedSolveMsg();
  } else {
    drawMembers(t, true);
    if (lastResult) drawDiagram(t, viewMode); else drawNeedSolveMsg();
  }
  drawQueryMarker(t);
  refreshQueryMemberOptions();
}

function drawQueryMarker(t) {
  if (!queryMarker) return;
  const [x, y] = toScreen(queryMarker.world_x, queryMarker.world_y, t);
  put(el('circle', {cx: x, cy: y, r: 6, fill: 'none', stroke: '#0891b2', 'stroke-width': 2.5}));
  put(el('line', {x1: x - 9, y1: y, x2: x + 9, y2: y, stroke: '#0891b2', 'stroke-width': 1.5}));
  put(el('line', {x1: x, y1: y - 9, x2: x, y2: y + 9, stroke: '#0891b2', 'stroke-width': 1.5}));
  const lines = [
    `N=${(queryMarker.N/1000).toFixed(2)}kN V=${(queryMarker.V/1000).toFixed(2)}kN`,
    `M=${(queryMarker.M/1000).toFixed(2)}kN·m Δ=${(queryMarker.disp*1000).toFixed(2)}mm`,

function niceStep(rough) {
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return step * mag;
}

// 目前實際看得到的世界座標範圍(把 camera 的平移/縮放反算回去),
// 讓格線可以跟著縮放/平移即時延伸覆蓋整個可視畫面, 不是固定算一次
// 模型外接框附近那一小圈就不再更新。
function visibleWorldRect(t) {
  const cxMin = (0 - camera.x) / camera.k, cxMax = (VB_W - camera.x) / camera.k;
  const cyMin = (0 - camera.y) / camera.k, cyMax = (VB_H - camera.y) / camera.k;
  const wx1 = (cxMin - t.sx) / t.scale + t.cx, wx2 = (cxMax - t.sx) / t.scale + t.cx;
  const wy1 = -(cyMin - t.sy) / t.scale + t.cy, wy2 = -(cyMax - t.sy) / t.scale + t.cy;
  return {
    minX: Math.min(wx1, wx2), maxX: Math.max(wx1, wx2),
    minY: Math.min(wy1, wy2), maxY: Math.max(wy1, wy2),
  };
}

let gridLabelSize = 14; // 可從「檢視」選單調整
function gridLabelStyle() { return `font-size:${gridLabelSize}px;font-weight:600;fill:#475569;`; }

function drawGrid(t) {
  const vis = visibleWorldRect(t);
  const w = (vis.maxX - vis.minX) || 1, h = (vis.maxY - vis.minY) || 1;
  const step = niceStep(Math.max(w, h) / 8);
  const padX = w * 0.15 + step, padY = h * 0.15 + step;
  const gx0 = Math.floor((vis.minX - padX) / step) * step, gx1 = Math.ceil((vis.maxX + padX) / step) * step;
  const gy0 = Math.floor((vis.minY - padY) / step) * step, gy1 = Math.ceil((vis.maxY + padY) / step) * step;
  const decimals = step < 1 ? 1 : 0;
  const band = 36; // 頂/左/右/下四條尺規底色帶的寬度, 配合可調字體
  // 四邊尺規的淡底色帶, 讓刻度數字在結構線條上也看得清楚
  putOverlay(el('rect', {x: 0, y: 0, width: VB_W, height: band, fill: 'rgba(255,255,255,0.9)'}));
  putOverlay(el('rect', {x: 0, y: 0, width: band, height: VB_H, fill: 'rgba(255,255,255,0.9)'}));
  putOverlay(el('rect', {x: 0, y: VB_H - band, width: VB_W, height: band, fill: 'rgba(255,255,255,0.9)'}));
  putOverlay(el('rect', {x: VB_W - band, y: 0, width: band, height: VB_H, fill: 'rgba(255,255,255,0.9)'}));
  let n = 0;
  for (let gx = gx0; gx <= gx1 + 1e-9; gx += step, n++) {
    const [x1, y1] = toScreen(gx, gy0, t), [x2, y2] = toScreen(gx, gy1, t);
    put(el('line', {x1, y1, x2, y2, class: 'grid-line'}));
    if (n % 2 === 0) {
      // 刻度文字放疊加圖層: 沿格線的螢幕位置移動(縮放/平移都會跟到),
      // 另一軸釘死在畫面邊緣, 字體不受camera縮放影響 —— 效果就像CAD
      // 軟體四邊的尺規, 不管怎麼縮放平移永遠看得到刻度, 上下對稱。
      const [ox] = toOverlayScreen(gx, gy0, t);
      const lblTop = el('text', {x: ox, y: band - 7, 'text-anchor': 'middle', style: gridLabelStyle()});
      lblTop.textContent = gx.toFixed(decimals);
      putOverlay(lblTop);
      const lblBottom = el('text', {x: ox, y: VB_H - band + 15, 'text-anchor': 'middle', style: gridLabelStyle()});
      lblBottom.textContent = gx.toFixed(decimals);
      putOverlay(lblBottom);
    }
  }
  n = 0;
  for (let gy = gy0; gy <= gy1 + 1e-9; gy += step, n++) {
    const [x1, y1] = toScreen(gx0, gy, t), [x2, y2] = toScreen(gx1, gy, t);
    put(el('line', {x1, y1, x2, y2, class: 'grid-line'}));
    if (n % 2 === 0) {
      const [, oy] = toOverlayScreen(gx0, gy, t);
      const lblLeft = el('text', {x: 5, y: oy + 4, 'text-anchor': 'start', style: gridLabelStyle()});
      lblLeft.textContent = gy.toFixed(decimals);
      putOverlay(lblLeft);
      const lblRight = el('text', {x: VB_W - 5, y: oy + 4, 'text-anchor': 'end', style: gridLabelStyle()});
      lblRight.textContent = gy.toFixed(decimals);
      putOverlay(lblRight);
    }
  }
  const lbl = el('text', {x: VB_W - band - 6, y: VB_H - band - 8, 'text-anchor': 'end', style: gridLabelStyle()});
  lbl.textContent = `格線間距 ${step} m`;
  putOverlay(lbl);
}

// 節點本體一律畫實心圓(剛接/連續節點的標準畫法);
// 桿件端點若有release,在靠近該端點處另外畫一個空心小圓(內部鉸接的標準畫法),
// 不是整個節點空心 —— 同一節點上其他沒release的桿件仍然是剛接。
function drawPinMarkers(t) {
  for (const m of model.members) {
    const ni = nodeById(m.node_i), nj = nodeById(m.node_j);
    if (!ni || !nj) continue;
    const dx = nj.x - ni.x, dy = nj.y - ni.y;
    const L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L;
    const offset = Math.min(0.35, L * 0.12);
    if (m.release_i) {
      const [x, y] = toScreen(ni.x + ux * offset, ni.y + uy * offset, t);
      put(el('circle', {cx: x, cy: y, r: 4.5, class: 'pin-marker'}));
    }
    if (m.release_j) {
      const [x, y] = toScreen(nj.x - ux * offset, nj.y - uy * offset, t);
      put(el('circle', {cx: x, cy: y, r: 4.5, class: 'pin-marker'}));
    }
  }
}

// ---------- 支承符號: 依 SW FEA 慣用的三種標準符號畫 ----------
function supportKind(s) {
  const hasUx = s.ux !== null && s.ux !== undefined;
  const hasUy = s.uy !== null && s.uy !== undefined;
  const hasRot = s.rot !== null && s.rot !== undefined;
  if (hasUx && hasUy && hasRot) return 'fixed';
  if (hasUx && hasUy && !hasRot) return 'pin';
  if (hasUy && !hasUx && !hasRot) return 'roller_y';
  if (hasUx && !hasUy && !hasRot) return 'roller_x';
  return 'custom';
}
function hatch(x0, y0, dx, dy, n, len) {
  // 沿(dx,dy)方向每隔一小段畫一條斜線 hatch, 從(x0,y0)開始排列n條
  const group = [];
  for (let i = -Math.floor(n/2); i <= Math.floor(n/2); i++) {
    const bx = x0 + dx * i, by = y0 + dy * i;
    group.push(el('line', {x1: bx, y1: by, x2: bx - len*0.6, y2: by + len, class: 'support-hatch'}));
  }
  return group;
}
function drawSupports(t) {
  for (const s of model.supports) {
    const n = nodeById(s.node);
    if (!n) continue;
    const [x, y] = toScreen(n.x, n.y, t);
    const kind = supportKind(s);
    if (kind === 'fixed') {
      put(el('line', {x1: x-11, y1: y, x2: x+11, y2: y, class: 'support-symbol', 'stroke-width': 2.5}));
      hatch(x-8, y, 5.3, 0, 3, 9).forEach(put);
    } else if (kind === 'pin') {
      put(el('polygon', {points: `${x-9},${y+16} ${x+9},${y+16} ${x},${y+2}`, fill: 'none', stroke: '#374151', 'stroke-width': 2}));
      put(el('line', {x1: x-11, y1: y+16, x2: x+11, y2: y+16, class: 'support-symbol', 'stroke-width': 2}));
      hatch(x-8, y+16, 5.3, 0, 3, 9).forEach(put);
    } else if (kind === 'roller_y') {
      put(el('polygon', {points: `${x-9},${y+13} ${x+9},${y+13} ${x},${y+2}`, fill: 'none', stroke: '#374151', 'stroke-width': 2}));
      [-6, 6].forEach(dx2 => put(el('circle', {cx: x+dx2, cy: y+16, r: 3.5, fill: 'none', stroke: '#374151', 'stroke-width': 1.5})));
      put(el('line', {x1: x-11, y1: y+20, x2: x+11, y2: y+20, class: 'support-symbol', 'stroke-width': 2}));
      hatch(x-8, y+20, 5.3, 0, 3, 8).forEach(put);
    } else if (kind === 'roller_x') {
      put(el('polygon', {points: `${x+13},${y-9} ${x+13},${y+9} ${x+2},${y}`, fill: 'none', stroke: '#374151', 'stroke-width': 2}));
      [-6, 6].forEach(dy2 => put(el('circle', {cx: x+16, cy: y+dy2, r: 3.5, fill: 'none', stroke: '#374151', 'stroke-width': 1.5})));
      put(el('line', {x1: x+20, y1: y-11, x2: x+20, y2: y+11, class: 'support-symbol', 'stroke-width': 2}));
      hatch(x+20, y-8, 0, 5.3, 3, 8).forEach(put);
    } else {
      put(el('rect', {x: x-6, y: y+4, width: 12, height: 12, fill: 'none', stroke: '#9333ea', 'stroke-width': 2, transform: `rotate(45 ${x} ${y+10})`}));
      const lbl = el('text', {x: x+12, y: y+18, 'font-size': 9, fill: '#9333ea'});
      lbl.textContent = '自訂支承';
      put(lbl);
    }
  }
}

function drawLoads(t) {

function fmt(v, digits) { return Math.abs(v) < 1e-9 ? '0' : v.toFixed(digits); }

function drawDeformed(t) {
  // 固定在畫面角落的疊加圖層(跟格線刻度同一套機制): 不會隨縮放跑掉/變大變小
  const lbl = el('text', {x: 42, y: 58, style: 'font-size:15px;font-weight:bold;fill:#ea580c;'});
  lbl.textContent = `變形放大 ×${lastResult.deform_scale.toFixed(1)}(非真實比例)`;
  putOverlay(lbl);
  for (const mid in lastResult.deformed) {
    const d = lastResult.deformed[mid];
    let pts = '';
    for (let i = 0; i < d.X.length; i++) {
      const [x, y] = toScreen(d.X[i], d.Y[i], t);
      pts += `${x},${y} `;
    }
    put(el('polyline', {points: pts.trim(), class: 'deformed-line'}));
  }
  // 在每個節點標實際位移量(mm),不是放大後的畫面尺寸
  for (const n of lastResult.nodes) {
    const disp = Math.hypot(n.ux, n.uy);
    if (disp < 1e-9) continue;
    const nn = nodeById(n.node);
    if (!nn) continue;
    const [x, y] = toScreen(nn.x, nn.y, t);
    const lbl2 = el('text', {x: x + 8, y: y + 14, class: 'value-label', fill: '#ea580c'});
    lbl2.textContent = `Δ=${(disp * 1000).toFixed(1)}mm`;
    put(lbl2);
  }
}

function labelIndices(vals) {
  const idxs = new Set([0, vals.length - 1]);
  for (let i = 1; i < vals.length - 1; i++) {
    const d1 = vals[i] - vals[i - 1], d2 = vals[i + 1] - vals[i];
    if (d1 * d2 < -1e-6) idxs.add(i);
  }
  return [...idxs].sort((a, b) => a - b);
}

function drawDiagram(t, kind) {
  let maxAbs = 1e-9;
  for (const mid in lastResult.diagrams) {
    for (const v of lastResult.diagrams[mid][kind]) maxAbs = Math.max(maxAbs, Math.abs(v));
  }
  const xs = model.nodes.map(n => n.x), ys = model.nodes.map(n => n.y);
  const worldDiag = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) || 1;
  const valueToWorld = (worldDiag * 0.15) / maxAbs;
  const unit = kind === 'M' ? 'kN·m' : 'kN';

  const lbl = el('text', {x: 42, y: 58, style: `font-size:15px;font-weight:bold;fill:${kind === 'M' ? '#dc2626' : '#2563eb'};`});
  lbl.textContent = `${kind} 圖 (最大值 ${(maxAbs/1000).toFixed(2)} ${unit})` + (kind === 'M' ? ' — 畫在拉力側' : '');
  putOverlay(lbl);

  for (const m of model.members) {
    const d = lastResult.diagrams[m.id];
    if (!d) continue;
    const ni = nodeById(m.node_i), nj = nodeById(m.node_j);
    const angle = Math.atan2(nj.y - ni.y, nj.x - ni.x);
    const c = Math.cos(angle), s = Math.sin(angle);
    const perp = [-s, c];
    let basePts = [], diagPts = [];
    for (let i = 0; i < d.x.length; i++) {
      const bx = ni.x + d.x[i] * c;
      const by = ni.y + d.x[i] * s;
      // 跟 plotting.py 的 plot_diagram() 同一套偏移方向(- perp * value),
      // 已經跟 SW FEA 對照驗證過; M 圖此慣例下會畫在拉力側。
      const val = d[kind][i] * valueToWorld;
      const ox = bx - perp[0] * val, oy = by - perp[1] * val;
      basePts.push(toScreen(bx, by, t));
      diagPts.push(toScreen(ox, oy, t));
    }
    const poly = basePts.map(p => p.join(',')).join(' ') + ' ' + diagPts.slice().reverse().map(p => p.join(',')).join(' ');
    put(el('polygon', {points: poly, class: 'diagram-fill' + (kind === 'M' ? ' M' : '')}));

    // 標數值: 兩端點 + 桿件內部所有轉折點(幾何/力量不連續處), 帶單位
    for (const i of labelIndices(d[kind])) {
      const val = d[kind][i];
      if (Math.abs(val) < maxAbs * 0.02) continue; // 太小的值不標, 避免畫面太亂
      const [lx, ly] = diagPts[i];
      const t2 = el('text', {x: lx, y: ly, class: 'value-label', fill: kind === 'M' ? '#dc2626' : '#2563eb', 'text-anchor': 'middle'});
      t2.textContent = (val / 1000).toFixed(2);
      put(t2);
    }
  }
}

  if (addMode === 'member') { handleMemberAddClick(id); return; }
  selected = {type: 'node', id};
  renderPropPanel();
}
function selectMember(id) { selected = {type: 'member', id}; renderPropPanel(); render(); }
function clearSelection() { selected = null; memberFirstNode = null; renderPropPanel(); render(); }

function handleMemberAddClick(id) {
  if (memberFirstNode === null) {
    memberFirstNode = id;
    setStatus('已選第一個節點 N' + id + ',再點第二個節點');
  } else if (memberFirstNode !== id) {
    const newId = Math.max(-1, ...model.members.map(m => m.id)) + 1;
    model.members.push({id: newId, node_i: memberFirstNode, node_j: id, section: model.sections[0].name, member_type: 'frame', release_i: false, release_j: false});
    memberFirstNode = null;
    setStatus('新增桿件 M' + newId);
    render();
  }
}

          <input id="p_fm" type="number" step="any" value="${pl ? pl.m : 0}">
        </div>
        <div class="row2">
          <button id="p_apply" style="background:#16a34a;color:white;">套用</button>
          <button id="p_cancel">取消</button>
        </div>
        <button id="p_delete" style="background:#dc2626;color:white;">刪除節點</button>
      </fieldset>`;
    document.getElementById('p_cancel').onclick = clearSelection;
    document.getElementById('p_apply').onclick = () => {
      n.x = parseFloat(document.getElementById('p_x').value);
      n.y = parseFloat(document.getElementById('p_y').value);
      const supVal = document.getElementById('p_sup').value;
      model.supports = model.supports.filter(s => s.node !== n.id);
      if (supVal === 'pin') model.supports.push({node: n.id, ux: 0.0, uy: 0.0, rot: null});
      if (supVal === 'fixed') model.supports.push({node: n.id, ux: 0.0, uy: 0.0, rot: 0.0});
      if (supVal === 'roller_y') model.supports.push({node: n.id, ux: null, uy: 0.0, rot: null});
      if (supVal === 'roller_x') model.supports.push({node: n.id, ux: 0.0, uy: null, rot: null});
      const fx = parseFloat(document.getElementById('p_fx').value) || 0;
      const fy = parseFloat(document.getElementById('p_fy').value) || 0;
      const fm = parseFloat(document.getElementById('p_fm').value) || 0;
      model.point_loads = model.point_loads.filter(p => p.node !== n.id);
      if (fx !== 0 || fy !== 0 || fm !== 0) model.point_loads.push({node: n.id, fx, fy, m: fm});
      render();
    };
    document.getElementById('p_delete').onclick = () => {
      model.nodes = model.nodes.filter(x => x.id !== n.id);
      model.members = model.members.filter(m => m.node_i !== n.id && m.node_j !== n.id);
      model.supports = model.supports.filter(s => s.node !== n.id);
      model.point_loads = model.point_loads.filter(p => p.node !== n.id);
      clearSelection();
    };
  } else {
    const m = model.members.find(x => x.id === selected.id);
    const sec = model.sections.find(s => s.name === m.section);
    panel.innerHTML = `
      <fieldset><legend>桿件 M${m.id}(N${m.node_i}→N${m.node_j})</legend>
        <label>元素類型</label>
        <select id="p_type">
          <option value="frame" ${m.member_type==='frame'?'selected':''}>frame(樑柱)</option>
          <option value="truss" ${m.member_type==='truss'?'selected':''}>truss(桁架)</option>
          <option value="cable" ${m.member_type==='cable'?'selected':''}>cable(纜線)</option>
        </select>
        <label><input id="p_ri" type="checkbox" style="width:auto;" ${m.release_i?'checked':''}> i端鉸接釋放(N${m.node_i}端,畫空心圓)</label>
        <label><input id="p_rj" type="checkbox" style="width:auto;" ${m.release_j?'checked':''}> j端鉸接釋放(N${m.node_j}端,畫空心圓)</label>
        <label>斷面 "${sec.name}"(改這裡會影響所有共用此斷面的桿件)</label>
        <div class="row3">
          <div><label>E (Pa)</label><input id="p_E" type="number" step="any" value="${sec.E}"></div>
          <div><label>I (m⁴)</label><input id="p_I" type="number" step="any" value="${sec.I}"></div>
          <div><label>A (m²)</label><input id="p_A" type="number" step="any" value="${sec.A}"></div>
        </div>
        <div class="row2">
          <button id="p_apply" style="background:#16a34a;color:white;">套用</button>
          <button id="p_cancel">取消</button>
        </div>
        <button id="p_delete" style="background:#dc2626;color:white;">刪除桿件</button>
      </fieldset>
      <fieldset><legend>內部鉸接(桿件中間)</legend>
        <p class="hint">力學上跟你自己拆桿件+兩端 release 完全等價(彎矩在該點不連續,剪力/軸力照樣傳遞),這裡是自動幫你拆——按下去會把 M${m.id} 從輸入的位置切成兩根桿件,並在切點互相釋放彎矩,等同 SW FEA 的 Add Internal Pin/Hinge。<br><b>注意</b>:如果切開後某一段沒有其他支承或桿件幫忙抗轉(例如懸臂的自由端),那一段會變成可以繞鉸接自由轉動的機構,Solve 會回報「勁度矩陣奇異」——這是真實的力學不穩定,不是這個功能的 bug,跟你截圖那種兩端都還接著柱子的梁不會有這個問題。</p>
        <label>位置量測方式</label>
        <select id="p_pin_mode">
          <option value="relative">相對位置(0~1,從 N${m.node_i} 起算)</option>
          <option value="absolute">絕對距離(m,從 N${m.node_i} 起算)</option>
        </select>
        <label>數值</label>
        <input id="p_pin_value" type="number" step="any" value="0.5">
        <button id="p_pin_add" style="width:100%;margin-top:0.5rem;background:#7c3aed;color:white;">✂ 在此加內部鉸接(分割桿件)</button>
      </fieldset>`;
    document.getElementById('p_cancel').onclick = clearSelection;
    document.getElementById('p_apply').onclick = () => {
      m.member_type = document.getElementById('p_type').value;
      m.release_i = document.getElementById('p_ri').checked;
      m.release_j = document.getElementById('p_rj').checked;
      sec.E = parseFloat(document.getElementById('p_E').value);
      sec.I = parseFloat(document.getElementById('p_I').value);
      sec.A = parseFloat(document.getElementById('p_A').value);
      render();
    };
    document.getElementById('p_delete').onclick = () => {
      model.members = model.members.filter(x => x.id !== m.id);
      clearSelection();
    };
    document.getElementById('p_pin_add').onclick = () => {
      const mode = document.getElementById('p_pin_mode').value;
      const val = parseFloat(document.getElementById('p_pin_value').value);
      splitMemberAtInternalPin(m, mode, val);
    };
  }
}

// 在桿件中間某個位置加「內部鉸接」: 力學上跟端點 release 是同一件事,
// 所以直接在該位置插入一個新節點, 把原桿件拆成兩根, 在新節點兩側
// 互相釋放彎矩(release_j / release_i) —— 不用改 solver, 純粹是
// 建模層的自動化, 等同使用者自己手動拆桿件 + 設定 release。
function splitMemberAtInternalPin(m, mode, value) {
  const ni = nodeById(m.node_i), nj = nodeById(m.node_j);
  const dx = nj.x - ni.x, dy = nj.y - ni.y;
  const L = Math.hypot(dx, dy);
  const a = mode === 'relative' ? value * L : value;
  if (!(a > 1e-6 && a < L - 1e-6)) {
    setStatus('內部鉸接位置必須嚴格在桿件內部(不能是兩端點),請確認數值');
    return;
  }
  const hasExtraLoads = model.distributed_loads.some(d => d.member === m.id) ||
                        model.member_point_loads.some(p => p.member === m.id);
  if (hasExtraLoads) {
    setStatus('注意: M' + m.id + ' 上有分佈載重/桿件中點載重, 分割後需要手動改 JSON 把它們對應到正確的新桿件, 這裡不會自動搬移');
  }
  const t = a / L;
  const px = ni.x + dx * t, py = ni.y + dy * t;
  const newNodeId = Math.max(-1, ...model.nodes.map(n => n.id)) + 1;
  model.nodes.push({id: newNodeId, x: Math.round(px * 100) / 100, y: Math.round(py * 100) / 100});
  const idA = Math.max(-1, ...model.members.map(mm => mm.id)) + 1;
  const idB = idA + 1;
  model.members.push({id: idA, node_i: m.node_i, node_j: newNodeId, section: m.section,
                       member_type: m.member_type, release_i: m.release_i, release_j: true});
  model.members.push({id: idB, node_i: newNodeId, node_j: m.node_j, section: m.section,
                       member_type: m.member_type, release_i: true, release_j: m.release_j});
  model.members = model.members.filter(x => x.id !== m.id);
  if (!hasExtraLoads) setStatus('已在 N' + newNodeId + ' 新增內部鉸接, M' + m.id + ' 分割成 M' + idA + '/M' + idB);
  selected = {type: 'member', id: idA};
  renderPropPanel();
  render();
}

// ---------- 鎖定(Snap): 節點鎖定 > 正交鎖定 > 格線鎖定, 依序套用 ----------
let lastActiveNodeId = null;

function currentGridStep() {
  const xs = model.nodes.length ? model.nodes.map(n => n.x) : [-5, 5];
  const ys = model.nodes.length ? model.nodes.map(n => n.y) : [-5, 5];
  const w = (Math.max(...xs) - Math.min(...xs)) || 1, h = (Math.max(...ys) - Math.min(...ys)) || 1;
  return niceStep(Math.max(w, h) / 8);
}

function snapPoint(pt, opts) {
  opts = opts || {};
  let {x, y} = pt;

  if (document.getElementById('snapNode').checked) {
    const step = currentGridStep();
    const tol = step * 0.25;
    let best = null, bestD = tol;
    for (const n of model.nodes) {
      if (opts.excludeId === n.id) continue;
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < bestD) { bestD = d; best = n; }
    }
    if (best) return {x: best.x, y: best.y, snappedToNode: best.id};
  }

  if (document.getElementById('snapOrtho').checked && opts.orthoRef) {
    const rx = opts.orthoRef.x, ry = opts.orthoRef.y;
    const dx = x - rx, dy = y - ry;
    const dist = Math.hypot(dx, dy);
    if (dist > 1e-6) {
      const step45 = Math.PI / 4;
      const ang = Math.round(Math.atan2(dy, dx) / step45) * step45;
      x = rx + dist * Math.cos(ang);
      y = ry + dist * Math.sin(ang);
    }
  }

  if (document.getElementById('snapGrid').checked) {
    const step = currentGridStep();
    x = Math.round(x / step) * step;
    y = Math.round(y / step) * step;
  }
  return {x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000};
}

// ---------- 畫布事件(節點拖曳 / 新增 / 平移) ----------
svg.addEventListener('pointerdown', (e) => {
  if (activePointers.size >= 2) return;
  if (dragNodeId !== null) return;
  const t = computeTransform();
  if (addMode === 'node') {
    const [wx, wy] = clientToWorld(e, t);
    const orthoRef = (selected && selected.type === 'node') ? nodeById(selected.id)
                      : (lastActiveNodeId !== null ? nodeById(lastActiveNodeId) : null);
    const snapped = snapPoint({x: wx, y: wy}, {orthoRef});
    if (snapped.snappedToNode !== undefined) {
      setStatus('該位置已經有節點 N' + snapped.snappedToNode + ', 沒有新增(避免重複節點)');
      return;
    }
    const newId = Math.max(-1, ...model.nodes.map(n => n.id)) + 1;
    model.nodes.push({id: newId, x: snapped.x, y: snapped.y});
    lastActiveNodeId = newId;
    setStatus('新增節點 N' + newId);
    render();
    return;
  }
  panState = {start: clientToCameraSpace(e), startCam: {...camera}, moved: false};
});

svg.addEventListener('pointermove', (e) => {
  if (activePointers.size >= 2) return;
  if (dragNodeId !== null) {
    dragMoved = true;
    const t = computeTransform();
    const [wx, wy] = clientToWorld(e, t);
    const n = nodeById(dragNodeId);
    const conn = model.members.find(m => m.node_i === dragNodeId || m.node_j === dragNodeId);
    const orthoRef = conn ? nodeById(conn.node_i === dragNodeId ? conn.node_j : conn.node_i) : null;
    const snapped = snapPoint({x: wx, y: wy}, {excludeId: dragNodeId, orthoRef});
    n.x = snapped.x; n.y = snapped.y;
    render();
    return;
  }
  if (panState) {
    const p = clientToCameraSpace(e);
    const dx = p.x - panState.start.x, dy = p.y - panState.start.y;
    if (Math.hypot(dx, dy) > 3) panState.moved = true;
    camera.x = panState.startCam.x + dx;
    camera.y = panState.startCam.y + dy;
    applyCameraTransform();
    scheduleRender();
  }
});

svg.addEventListener('pointerup', () => {
  if (dragNodeId !== null) {
    const id = dragNodeId;
    dragNodeId = null;
    lastActiveNodeId = id;
    if (!dragMoved) selectNode(id); else { selected = {type: 'node', id}; renderPropPanel(); }
    render();
    return;
  }
  if (panState) {
    if (!panState.moved && addMode !== 'member') clearSelection();
    panState = null;
  }
});

document.getElementById('showGridToggle').addEventListener('change', render);
document.getElementById('gridLabelSizeInput').addEventListener('input', (e) => {
  const v = parseInt(e.target.value, 10);
  if (!isNaN(v) && v > 0) { gridLabelSize = v; render(); }
});

document.querySelectorAll('.viewBtn').forEach(btn => {

document.getElementById('btnAddNode').addEventListener('click', (e) => {
  addMode = addMode === 'node' ? null : 'node';

  e.target.classList.toggle('active', addMode === 'node');
  document.getElementById('btnAddMember').classList.remove('active');

});
document.getElementById('btnAddMember').addEventListener('click', (e) => {
  addMode = addMode === 'member' ? null : 'member';
  memberFirstNode = null;
  e.target.classList.toggle('active', addMode === 'member');
  document.getElementById('btnAddNode').classList.remove('active');
  setStatus(addMode === 'member' ? '新增桿件模式:依序點兩個節點' : '');
});

document.getElementById('btnSolve').addEventListener('click', async () => {
  setStatus('求解中...');
  try {
    const res = await fetch('/solve', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(model)
    });
    if (!res.ok) { setStatus('API 錯誤: ' + await res.text()); return; }
    lastResult = await res.json();
    setStatus('完成');
    renderTables();
    render();
  } catch (e) { setStatus('連線失敗: ' + e.message); }
});

function setStatus(s) { document.getElementById('status').textContent = s; }

function renderTables() {
  const nb = document.querySelector('#nodeTable tbody'); nb.innerHTML = '';
  for (const n of lastResult.nodes) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${n.node}</td><td>${n.ux.toExponential(3)}</td><td>${n.uy.toExponential(3)}</td>
      <td>${n.rot.toExponential(3)}</td><td>${(n.Rx/1000).toFixed(3)}</td><td>${(n.Ry/1000).toFixed(3)}</td><td>${(n.M/1000).toFixed(3)}</td>`;
    nb.appendChild(tr);
  }
  const mb = document.querySelector('#memberTable tbody'); mb.innerHTML = '';
  for (const m of lastResult.members) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${m.member_id}</td><td>${m.L.toFixed(3)}</td><td>${m.angle_deg.toFixed(1)}</td>
      <td>${(m.N1/1000).toFixed(3)}</td><td>${(m.V1/1000).toFixed(3)}</td><td>${(m.M1/1000).toFixed(3)}</td>
      <td>${(m.N2/1000).toFixed(3)}</td><td>${(m.V2/1000).toFixed(3)}</td><td>${(m.M2/1000).toFixed(3)}</td>`;
    mb.appendChild(tr);
  }
}

// ---------- 存檔 / 讀檔(伺服器端具名存檔) ----------
let currentName = null;

async function refreshModelList(selectName) {
  try {
    const res = await fetch('/models');
    const data = await res.json();
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = '';
    for (const name of data.names) {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    }
    if (selectName) sel.value = selectName;
  } catch (e) { setStatus('讀取存檔清單失敗: ' + e.message); }
}

async function saveModelAs(name) {
  if (!name) { setStatus('請先在「專案名稱」輸入名字'); return; }
  try {
    const res = await fetch('/models/' + encodeURIComponent(name), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(model)
    });
    if (!res.ok) { setStatus('儲存失敗: ' + await res.text()); return; }
    currentName = name;
    setStatus('已儲存為 "' + name + '"');
    refreshModelList(name);
  } catch (e) { setStatus('儲存失敗: ' + e.message); }
}

document.getElementById('btnNew').addEventListener('click', () => {
  if (!confirm('新建會清空目前畫布內容(未儲存的修改會遺失),確定繼續?')) return;
  model = {
    nodes: [], sections: [{name: 'sec', E: 200e9, I: 1e-4, A: 0.01}],
    members: [], supports: [], point_loads: [], distributed_loads: [], member_point_loads: []
  };
  lastResult = null;
  currentName = null;
  document.getElementById('modelName').value = '';
  camera = {x: 0, y: 0, k: 1};
  applyCameraTransform();
  clearSelection();
  setStatus('已新建空白專案');
});
document.getElementById('btnSave').addEventListener('click', () => {
  const name = currentName || document.getElementById('modelName').value.trim();
  saveModelAs(name);
});
document.getElementById('btnSaveAs').addEventListener('click', () => {
  const name = document.getElementById('modelName').value.trim();
  saveModelAs(name);
});
document.getElementById('btnLoad').addEventListener('click', async () => {
  const name = document.getElementById('modelSelect').value;
  if (!name) { setStatus('沒有可載入的存檔'); return; }
  try {
    const res = await fetch('/models/' + encodeURIComponent(name));
    if (!res.ok) { setStatus('載入失敗: ' + await res.text()); return; }
    model = await res.json();
    currentName = name;
    document.getElementById('modelName').value = name;
    lastResult = null;
    clearSelection();
    setStatus('已載入 "' + name + '"(記得重新按 Solve)');
  } catch (e) { setStatus('載入失敗: ' + e.message); }
});
document.getElementById('btnDeleteModel').addEventListener('click', async () => {
  const name = document.getElementById('modelSelect').value;
  if (!name) return;
  try {
    const res = await fetch('/models/' + encodeURIComponent(name), {method: 'DELETE'});
    if (!res.ok) { setStatus('刪除失敗: ' + await res.text()); return; }
    if (currentName === name) currentName = null;
    setStatus('已刪除 "' + name + '"');
    refreshModelList();
  } catch (e) { setStatus('刪除失敗: ' + e.message); }
});

// ---------- Export / Import(純瀏覽器端,不經伺服器) ----------
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btnExportJson').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(model, null, 2)], {type: 'application/json'});
  downloadBlob(blob, (currentName || 'frame2d_model') + '.json');
});

document.getElementById('importJsonFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      model = JSON.parse(reader.result);
      lastResult = null;
      currentName = null;
      clearSelection();
      setStatus('已匯入 ' + file.name + '(記得重新按 Solve)');
    } catch (err) { setStatus('匯入失敗,JSON 格式錯誤: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('btnExportMd').addEventListener('click', () => {
  if (!lastResult) { setStatus('請先按 Solve 才有結果可匯出'); return; }
  let md = `# frame2d 分析結果${currentName ? '(' + currentName + ')' : ''}\n\n`;
  md += `## 節點結果\n\n`;
  md += `| node | ux (m) | uy (m) | rot (rad) | Rx (kN) | Ry (kN) | M (kN·m) |\n`;
  md += `|---|---|---|---|---|---|---|\n`;
  for (const n of lastResult.nodes) {
    md += `| ${n.node} | ${n.ux.toExponential(3)} | ${n.uy.toExponential(3)} | ${n.rot.toExponential(3)} | ${(n.Rx/1000).toFixed(3)} | ${(n.Ry/1000).toFixed(3)} | ${(n.M/1000).toFixed(3)} |\n`;
  }
  md += `\n## 桿件端內力\n\n`;
  md += `| member | L (m) | 角度(度) | N1 (kN) | V1 (kN) | M1 (kN·m) | N2 (kN) | V2 (kN) | M2 (kN·m) |\n`;
  md += `|---|---|---|---|---|---|---|---|---|\n`;
  for (const m of lastResult.members) {
    md += `| ${m.member_id} | ${m.L.toFixed(3)} | ${m.angle_deg.toFixed(1)} | ${(m.N1/1000).toFixed(3)} | ${(m.V1/1000).toFixed(3)} | ${(m.M1/1000).toFixed(3)} | ${(m.N2/1000).toFixed(3)} | ${(m.V2/1000).toFixed(3)} | ${(m.M2/1000).toFixed(3)} |\n`;
  }
  const blob = new Blob([md], {type: 'text/markdown'});
  downloadBlob(blob, (currentName || 'frame2d_result') + '.md');
});

document.getElementById('btnExportPdf').addEventListener('click', async () => {
  setStatus('產生 PDF 中...');
  try {
    const res = await fetch('/export/pdf', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(model)
    });
    if (!res.ok) { setStatus('PDF 產生失敗: ' + await res.text()); return; }
    const blob = await res.blob();
    downloadBlob(blob, (currentName || 'frame2d_report') + '.pdf');
    setStatus('PDF 已下載');
  } catch (e) { setStatus('PDF 產生失敗: ' + e.message); }
});

document.getElementById('propModalBackdrop').addEventListener('click', clearSelection);

refreshModelList();
render();
